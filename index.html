    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="איטלקית 300">
    <meta name="mobile-web-app-capable" content="yes">

    <link rel="manifest" href="manifest.json">
    <style>
        :root { 
            --primary: #009246; 
            --secondary: #ce2b37; 
            --bg: #f4f7f6; 
        }
        
        body { 
            font-family: sans-serif; 
            background-color: var(--bg); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 15px; 
            box-sizing: border-box;
            user-select: none; /* מונע סימון טקסט מעצבן בטלפון */
            -webkit-user-select: none;
        }

        h1 {
            margin-top: 10px;
            margin-bottom: 5px;
            font-size: 1.6rem;
        }

        #counter {
            margin-bottom: 5px;
            font-size: 1rem;
            color: #555;
        }

        #save-status {
            font-size: 0.85rem;
            color: #009246;
            margin-bottom: 15px;
            height: 15px;
            font-weight: bold;
        }
        
        .card-container { 
            width: 100%;
            max-width: 350px; 
            height: 230px; 
            perspective: 1000px; 
            cursor: pointer; 
            margin-bottom: 25px; 
            -webkit-tap-highlight-color: transparent; /* מונע הבהוב כחול בנגיעה */
        }

        .card { 
            width: 100%; 
            height: 100%; 
            position: relative; 
            transform-style: preserve-3d; 
            transition: transform 0.4s; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.15); 
            border-radius: 15px; 
        }

        .card.flipped { transform: rotateY(180deg); }
        
        .card-face { 
            position: absolute; 
            width: 100%; 
            height: 100%; 
            backface-visibility: hidden; 
            -webkit-backface-visibility: hidden;
            border-radius: 15px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            padding: 15px; 
            box-sizing: border-box;
            background: white; 
            border: 2px solid #ddd; 
        }

        .card-front { border-top: 8px solid var(--primary); }
        .card-back { transform: rotateY(180deg); background: #fff5f5; border-top: 8px solid var(--secondary); }
        
        .word-it { font-size: 2.2rem; color: var(--primary); font-weight: bold; margin-bottom: 5px; text-align: center; }
        .word-he { font-size: 1.6rem; font-weight: bold; text-align: center; }
        .word-en { font-size: 1.1rem; color: #666; margin-top: 5px; font-style: italic; text-align: center; }
        
        .hint-box {
            margin-top: 10px;
            font-size: 0.95rem;
            color: #555;
            background: #fff9db;
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px dashed #f59f00;
            display: none;
            width: 90%;
            text-align: center;
        }

        .btn-group {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }

        .controls { 
            display: flex; 
            gap: 12px; 
            flex-wrap: wrap; 
            justify-content: center; 
            width: 100%;
            max-width: 400px; 
            padding: 10px 0;
        }

        button { 
            padding: 12px 18px; 
            cursor: pointer; 
            border-radius: 8px; 
            border: 1px solid #ccc; 
            background: white; 
            font-size: 1rem; 
            font-weight: bold;
            transition: transform 0.1s, background-color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-tap-highlight-color: transparent;
        }

        button:active { transform: scale(0.95); }
        
        .btn-main { background: var(--primary); color: white; border: none; }
        .btn-main:hover { background: #007d3c; }
        
        .btn-fail { border-color: var(--secondary); color: var(--secondary); background: #fff8f8; }
        .btn-fail:hover { background: #ffebeb; }

        .btn-action {
            padding: 8px 14px;
            font-size: 0.9rem;
            background: #f0f0f0;
            border: 1px solid #ddd;
        }
        
        .btn-reset {
            margin-top: 15px;
            padding: 6px 12px;
            font-size: 0.8rem;
            background: #eee;
            color: #666;
            border: none;
        }
    </style>
</head>
<body>

    <h1>300 מילים וביטויים באיטלקית</h1>
    <div id="counter">מערכת בטעינה...</div>
    <div id="save-status"></div>

    <div class="card-container" onclick="toggleFlip()">
        <div class="card" id="card">
            <div class="card-face card-front">
                <div class="word-it" dir="ltr" id="word-it"></div>
                <div class="btn-group">
                    <button class="btn-action" onclick="playAudio(event)">🔊 השמע</button>
                    <button class="btn-action" style="background-color: #fff9db;" onclick="handleHint(event)">💡 רמז לזיכרון</button>
                </div>
                <div class="hint-box" id="hint-box"></div>
            </div>
            <div class="card-face card-back">
                <div class="word-he" id="word-he"></div>
                <div class="word-en" dir="ltr" id="word-en"></div>
            </div>
        </div>
    </div>

    <div class="controls">
        <button onclick="prevCard()">◀ הקודם</button>
        <button class="btn-main" onclick="toggleFlip()">הפוך קלף</button>
        <button class="btn-fail" onclick="markAsForgot()">לא זכרתי 🔄</button>
        <button onclick="nextCard()">הבא ▶</button>
    </div>

    <button class="btn-reset" onclick="resetApp()">איפוס וערבוב מחדש</button>

        let queue = [];
        let idx = 0;

        function loadSavedState() {
            try {
                const savedQueue = localStorage.getItem('italian_flashcards_queue');
                const savedIdx = localStorage.getItem('italian_flashcards_idx');
                
                if (savedQueue) {
                    queue = JSON.parse(savedQueue);
                    idx = savedIdx ? parseInt(savedIdx, 10) : 0;
                    if (idx >= queue.length || isNaN(idx)) idx = 0;
                    showStatusMessage("ההתקדמות והמילים שלא זכרת נטענו!");
                } else {
                    queue = [...originalWordList];
                    idx = 0;
                }
            } catch (e) {
                queue = [...originalWordList];
                idx = 0;
            }
        }

        function saveCurrentState() {
            try {
                localStorage.setItem('italian_flashcards_queue', JSON.stringify(queue));
                localStorage.setItem('italian_flashcards_idx', idx);
            } catch (e) {}
        }

        function showStatusMessage(text) {
            const statusDiv = document.getElementById('save-status');
            if (statusDiv) {
                statusDiv.innerText = text;
                setTimeout(() => { statusDiv.innerText = ''; }, 3000);
            }
        }

        function update() {
            if (queue.length === 0) return;
            
            document.getElementById('word-it').innerText = queue[idx].it || '';
            document.getElementById('word-he').innerText = queue[idx].he || '';
            document.getElementById('word-en').innerText = queue[idx].en || '';
            document.getElementById('counter').innerText = `מילה ${idx + 1} מתוך ${queue.length}`;
            
            const hintBox = document.getElementById('hint-box');
            hintBox.style.display = 'none';
            hintBox.innerText = '';
            
            saveCurrentState();
        }

        function toggleFlip() { document.getElementById('card').classList.toggle('flipped'); }
        
        function nextCard() {
            document.getElementById('card').classList.remove('flipped');
            setTimeout(() => { idx = (idx + 1) % queue.length; update(); }, 150);
        }

        function prevCard() {
            document.getElementById('card').classList.remove('flipped');
            setTimeout(() => { idx = (idx - 1 + queue.length) % queue.length; update(); }, 150);
        }

        function markAsForgot() {
            if (queue.length <= 1) {
                alert("נשארה רק מילה אחת בתור!");
                return;
            }
            let item = queue.splice(idx, 1)[0];
            queue.push(item);
            
            showStatusMessage("המילה הועברה לסוף התור ותישמר!");
            document.getElementById('card').classList.remove('flipped');
            setTimeout(() => {
                if (idx >= queue.length) idx = 0;
                update();
            }, 150);
        }

        function playAudio(e) {
            e.stopPropagation();
            if (!queue[idx]) return;
            let cleanText = queue[idx].it.split('(')[0].trim();
            let u = new SpeechSynthesisUtterance(cleanText);
            u.lang = 'it-IT';
            speechSynthesis.speak(u);
        }

        function handleHint(e) {
            e.stopPropagation(); 
            const hintBox = document.getElementById('hint-box');
            const currentWord = queue[idx];
            if (!currentWord) return;
            
            if (currentWord.hook) {
                hintBox.innerText = currentWord.hook;
                hintBox.style.display = 'block';
            } else {
                let cleanText = currentWord.it.split('/')[0].split('(')[0].trim();
                const searchQuery = `italian word ${cleanText} mnemonic etymology`;
                const searchUrl = `https://www.google.com/search?q=${encodeURIComponent(searchQuery)}`;
                window.open(searchUrl, '_blank');
                showStatusMessage("מחפש עוגן זיכרון בגוגל...");
            }
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function resetApp() {
            if (confirm("האם לאפס הכל ולערבב את כל 300 המילים מחדש?")) {
                try {
                    localStorage.removeItem('italian_flashcards_queue');
                    localStorage.removeItem('italian_flashcards_idx');
                } catch(e) {}
                queue = shuffleArray([...originalWordList]);
                idx = 0;
                update();
                showStatusMessage("האפליקציה אותחלה ועורבבה מחדש!");
            }
        }

        window.onload = function() {
            loadSavedState();
            if (!localStorage.getItem('italian_flashcards_queue')) {
                queue = shuffleArray(queue);
            }
            update();
        };
    </script>
